version: "3.8"

services:
  # Redis
  starloco_redis:
    image: "redis/redis-stack"
    restart: always
    networks:
      - starloco
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_ARG: "--save 60 1000 --appendonly yes"
    volumes:
      - "db-game:/data/"

  # MariaDB
  starloco_mariadb:
    image: mariadb:11.3
    restart: always
    networks:
      - starloco
    environment:
      MYSQL_ROOT_PASSWORD: CYoEw5SaBv1kIk
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db-sql:/var/lib/mysql
      - $PWD/db-init/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      timeout: 20s
      retries: 10

  # Login
  starloco_login:
    image: starloco/login:latest
    restart: always
    networks:
      - starloco
    ports:
      - "450:450"
    volumes:
      - $PWD/config/login.config.properties:/app/login.config.properties
    depends_on:
      starloco_mariadb:
        condition: service_healthy

  # Game
  starloco_game:
    image: starloco/game:latest
    restart: always
    networks:
      - starloco
    ports:
      - "5555:5555"
    volumes:
      - $PWD/config/:/app/config
      - $PWD/scripts:/app/scripts
    depends_on:
      starloco_redis:
        condition: service_started
      starloco_mariadb:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./docker/Dockerfile

  # Web / données Dofus
  starloco_web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: starloco_web
    restart: always
    networks:
      - starloco
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      starloco_mariadb:
        condition: service_healthy
    environment:
      MARIADB_HOST: starloco_mariadb
      LOGIN_HOST: starloco_login
      GAME_HOST: starloco_game
      STARLOCO_DB_PASSWORD: CYoEw5SaBv1kIk
    volumes:
      - ./web/public:/src/public:ro
      - web_runtime:/runtime
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro

networks:
  starloco:

volumes:
  db-sql:
  db-game:
  web_runtime: